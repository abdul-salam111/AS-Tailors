<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
            <tr>
              <td style="background-color:#0f5c5c; padding:24px 32px;">
                <span style="color:#ffffff; font-size:20px; font-weight:bold;">AS Tailors</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px; font-size:16px; color:#222222;">Confirm your email address</p>
                <p style="margin:0 0 24px; font-size:14px; color:#555555;">
                  Enter this code in the app to finish creating your account:
                </p>
                <div style="text-align:center; margin:0 0 24px;">
                  <span style="display:inline-block; padding:16px 24px; background-color:#f4f4f4; border-radius:6px; font-size:32px; font-weight:bold; letter-spacing:8px; color:#0f5c5c;">
                    {{ .Token }}
                  </span>
                </div>
                <p style="margin:0; font-size:13px; color:#888888;">
                  This code expires in 1 hour. If you didn't request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
